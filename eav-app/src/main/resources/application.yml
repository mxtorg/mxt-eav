spring:
  application:
    name: mxt-eav
  
  datasource:
    url: jdbc:h2:mem:mxt_eav;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  cache:
    type: simple
    cache-names: entityTypes, attributes

logging:
  level:
    com.mxt.eav: DEBUG
    org.hibernate.SQL: DEBUG
