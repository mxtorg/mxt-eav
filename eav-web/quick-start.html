<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXT EAV - 快速测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }
        .tab {
            flex: 1;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 500;
            color: #6c757d;
            transition: all 0.3s;
        }
        .tab:hover {
            background: #e9ecef;
        }
        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        .content {
            padding: 30px;
            display: none;
        }
        .content.active {
            display: block;
        }
        .status {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }
        th {
            background: #667eea;
            color: white;
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #e9ecef;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            margin-right: 8px;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        pre {
            background: #2c3e50;
            color: #fff;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
            margin-top: 10px;
        }
        .section-title {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card h2 {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        .stat-card p {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏗️ MXT EAV 管理系统</h1>
            <p>简洁高效的实体-属性-值数据模型</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('dashboard')">📊 仪表板</button>
            <button class="tab" onclick="showTab('entity-types')">📦 实体类型</button>
            <button class="tab" onclick="showTab('attributes')">🏷️ 属性</button>
            <button class="tab" onclick="showTab('entities')">📋 实体</button>
            <button class="tab" onclick="showTab('api')">🔌 API测试</button>
        </div>

        <div id="status" class="status"></div>

        <!-- 仪表板 -->
        <div id="dashboard" class="content active">
            <h2 class="section-title">系统概览</h2>
            <div class="grid">
                <div class="stat-card">
                    <h2 id="entity-type-count">0</h2>
                    <p>实体类型</p>
                </div>
                <div class="stat-card">
                    <h2 id="attribute-count">0</h2>
                    <p>属性定义</p>
                </div>
                <div class="stat-card">
                    <h2 id="entity-count">0</h2>
                    <p>实体数据</p>
                </div>
            </div>
            <div class="card">
                <h3>🎯 快速操作</h3>
                <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="refreshDashboard()">🔄 刷新数据</button>
                    <button class="btn btn-success" onclick="testConnection()">📡 测试连接</button>
                </div>
            </div>
            <div class="card">
                <h3>📚 快速开始</h3>
                <p style="margin-top: 10px; line-height: 1.8; color: #495057;">
                    <strong>1.</strong> 点击"实体类型"查看和管理实体类型<br>
                    <strong>2.</strong> 点击"属性"查看和管理属性定义<br>
                    <strong>3.</strong> 点击"实体"查看和管理实体数据<br>
                    <strong>4.</strong> 点击"API测试"测试RESTful接口
                </p>
            </div>
        </div>

        <!-- 实体类型 -->
        <div id="entity-types" class="content">
            <h2 class="section-title">实体类型管理</h2>
            <button class="btn btn-primary" onclick="loadEntityTypes()">🔄 刷新</button>
            <div id="entity-types-table"></div>
        </div>

        <!-- 属性 -->
        <div id="attributes" class="content">
            <h2 class="section-title">属性定义管理</h2>
            <div style="margin-bottom: 20px;">
                <label>选择实体类型：</label>
                <select id="entity-type-select" style="padding: 8px; border-radius: 4px; border: 1px solid #ddd;" onchange="loadAttributes()">
                    <option value="">加载中...</option>
                </select>
            </div>
            <div id="attributes-table"></div>
        </div>

        <!-- 实体 -->
        <div id="entities" class="content">
            <h2 class="section-title">实体数据管理</h2>
            <div style="margin-bottom: 20px;">
                <label>选择实体类型：</label>
                <select id="entity-type-select-entities" style="padding: 8px; border-radius: 4px; border: 1px solid #ddd;" onchange="loadEntities()">
                    <option value="">加载中...</option>
                </select>
            </div>
            <div id="entities-table"></div>
        </div>

        <!-- API测试 -->
        <div id="api" class="content">
            <h2 class="section-title">API接口测试</h2>
            <div class="card">
                <h3>HTTP请求</h3>
                <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                    <select id="api-method" style="padding: 10px; border-radius: 6px; border: 1px solid #ddd; min-width: 100px;">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                    </select>
                    <input type="text" id="api-endpoint" value="/api/entity-types" placeholder="输入API路径" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    <button class="btn btn-primary" onclick="testApi()">发送请求</button>
                </div>
                <div>
                    <h4 style="margin-bottom: 10px;">快捷操作：</h4>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button class="btn btn-success" onclick="setApiTest('GET', '/api/entity-types')">获取实体类型</button>
                        <button class="btn btn-success" onclick="setApiTest('GET', '/api/entity-types/1/attributes')">获取属性</button>
                        <button class="btn btn-success" onclick="setApiTest('GET', '/api/entity-types/1/entities')">获取实体</button>
                    </div>
                </div>
                <h4 style="margin-top: 20px; margin-bottom: 10px;">响应结果：</h4>
                <pre id="api-response">点击"发送请求"开始测试</pre>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        
        // 显示状态
        function showStatus(message, isError = false) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${isError ? 'error' : 'success'}`;
            setTimeout(() => {
                statusEl.className = 'status';
            }, 3000);
        }

        // API请求
        async function apiRequest(method, endpoint, data = null) {
            try {
                const options = {
                    method,
                    headers: {
                        'Content-Type': 'application/json'
                    }
                };
                if (data) {
                    options.body = JSON.stringify(data);
                }
                const response = await fetch(`${API_BASE}${endpoint}`, options);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // 切换标签
        function showTab(tabId) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');

            if (tabId === 'dashboard') refreshDashboard();
            if (tabId === 'entity-types') loadEntityTypes();
            if (tabId === 'attributes') initAttributesTab();
            if (tabId === 'entities') initEntitiesTab();
        }

        // 刷新仪表板
        async function refreshDashboard() {
            try {
                const entityTypes = await apiRequest('GET', '/entity-types');
                let totalAttributes = 0;
                let totalEntities = 0;

                for (let et of entityTypes) {
                    try {
                        const attrs = await apiRequest('GET', `/entity-types/${et.id}/attributes`);
                        totalAttributes += attrs.length;
                        const ents = await apiRequest('GET', `/entity-types/${et.id}/entities`);
                        totalEntities += ents.length;
                    } catch (e) {
                        // continue
                    }
                }

                document.getElementById('entity-type-count').textContent = entityTypes.length;
                document.getElementById('attribute-count').textContent = totalAttributes;
                document.getElementById('entity-count').textContent = totalEntities;
                showStatus('仪表板数据已更新！');
            } catch (error) {
                showStatus('刷新失败，请确保后端已启动', true);
            }
        }

        // 测试连接
        async function testConnection() {
            try {
                await apiRequest('GET', '/entity-types');
                showStatus('✅ 后端连接成功！');
                refreshDashboard();
            } catch (error) {
                showStatus('❌ 后端连接失败，请确保 mvn spring-boot:run 已启动', true);
            }
        }

        // 加载实体类型
        async function loadEntityTypes() {
            try {
                const types = await apiRequest('GET', '/entity-types');
                const html = types.length > 0 ? `
                    <table>
                        <tr><th>ID</th><th>编码</th><th>名称</th><th>描述</th><th>创建时间</th></tr>
                        ${types.map(t => `<tr><td>${t.id}</td><td><strong>${t.code}</strong></td><td>${t.name}</td><td>${t.description || '-'}</td><td>${new Date(t.createdAt).toLocaleString()}</td></tr>`).join('')}
                    </table>
                ` : '<p style="padding: 20px; text-align: center; color: #6c757d;">暂无实体类型数据</p>';
                document.getElementById('entity-types-table').innerHTML = html;
                showStatus('实体类型加载成功！');
            } catch (error) {
                document.getElementById('entity-types-table').innerHTML = '<p style="color: #dc3545; padding: 20px;">加载失败，请确保后端服务已启动</p>';
                showStatus('加载失败', true);
            }
        }

        // 初始化属性标签
        async function initAttributesTab() {
            try {
                const types = await apiRequest('GET', '/entity-types');
                const select = document.getElementById('entity-type-select');
                select.innerHTML = types.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
                if (types.length > 0) loadAttributes();
            } catch (error) {
                showStatus('加载失败', true);
            }
        }

        // 加载属性
        async function loadAttributes() {
            try {
                const entityTypeId = document.getElementById('entity-type-select').value;
                if (!entityTypeId) return;
                const attributes = await apiRequest('GET', `/entity-types/${entityTypeId}/attributes`);
                const html = attributes.length > 0 ? `
                    <table>
                        <tr><th>ID</th><th>编码</th><th>名称</th><th>数据类型</th><th>必填</th><th>排序</th></tr>
                        ${attributes.map(a => `<tr><td>${a.id}</td><td>${a.code}</td><td>${a.name}</td><td><span style="background: #e9ecef; padding: 2px 8px; border-radius: 4px; font-size: 12px;">${a.dataType}</span></td><td>${a.required ? '✅' : '❌'}</td><td>${a.sortOrder}</td></tr>`).join('')}
                    </table>
                ` : '<p style="padding: 20px; text-align: center; color: #6c757d;">暂无属性数据</p>';
                document.getElementById('attributes-table').innerHTML = html;
                showStatus('属性加载成功！');
            } catch (error) {
                document.getElementById('attributes-table').innerHTML = '<p style="color: #dc3545; padding: 20px;">加载失败</p>';
            }
        }

        // 初始化实体标签
        async function initEntitiesTab() {
            try {
                const types = await apiRequest('GET', '/entity-types');
                const select = document.getElementById('entity-type-select-entities');
                select.innerHTML = types.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
                if (types.length > 0) loadEntities();
            } catch (error) {
                showStatus('加载失败', true);
            }
        }

        // 加载实体
        async function loadEntities() {
            try {
                const entityTypeId = document.getElementById('entity-type-select-entities').value;
                if (!entityTypeId) return;
                const entities = await apiRequest('GET', `/entity-types/${entityTypeId}/entities`);
                
                let tableHtml = '';
                if (entities.length > 0) {
                    const allAttrKeys = new Set();
                    entities.forEach(e => {
                        if (e.attributes) Object.keys(e.attributes).forEach(k => allAttrKeys.add(k));
                    });
                    const attrKeys = Array.from(allAttrKeys);
                    
                    tableHtml = `
                        <table>
                            <tr>
                                <th>ID</th><th>编码</th><th>名称</th>
                                ${attrKeys.map(k => `<th>${k}</th>`).join('')}
                                <th>创建时间</th>
                            </tr>
                            ${entities.map(e => `
                                <tr>
                                    <td>${e.id}</td><td>${e.code}</td><td><strong>${e.name}</strong></td>
                                    ${attrKeys.map(k => `<td>${e.attributes && e.attributes[k] !== undefined ? e.attributes[k] : '-'}</td>`).join('')}
                                    <td>${new Date(e.createdAt).toLocaleString()}</td>
                                </tr>
                            `).join('')}
                        </table>
                    `;
                } else {
                    tableHtml = '<p style="padding: 20px; text-align: center; color: #6c757d;">暂无实体数据</p>';
                }
                
                document.getElementById('entities-table').innerHTML = tableHtml;
                showStatus('实体加载成功！');
            } catch (error) {
                document.getElementById('entities-table').innerHTML = '<p style="color: #dc3545; padding: 20px;">加载失败</p>';
            }
        }

        // API测试
        function setApiTest(method, endpoint) {
            document.getElementById('api-method').value = method;
            document.getElementById('api-endpoint').value = endpoint;
        }

        async function testApi() {
            const method = document.getElementById('api-method').value;
            const endpoint = document.getElementById('api-endpoint').value;
            try {
                const result = await apiRequest(method, endpoint);
                document.getElementById('api-response').textContent = JSON.stringify(result, null, 2);
                showStatus('API请求成功！');
            } catch (error) {
                document.getElementById('api-response').textContent = `错误: ${error.message}\n\n请确保后端服务已启动！`;
                showStatus('API请求失败', true);
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('MXT EAV 页面已加载');
            testConnection();
        });
    </script>
</body>
</html>
