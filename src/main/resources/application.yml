spring:
  application:
    name: mxt-eav
  
  datasource:
    url: jdbc:mysql://localhost:3306/mxt_eav?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  cache:
    type: simple
    cache-names: entityTypes, attributes

logging:
  level:
    com.mxt.eav: DEBUG
    org.hibernate.SQL: DEBUG
